save_data: /kaggle/working/opennmt_model/data
src_vocab: /kaggle/working/opennmt_model/vocab.txt
tgt_vocab: /kaggle/working/opennmt_model/vocab.txt
share_vocab: true
data:
  corpus_1:
    path_src: /kaggle/working/bpcc_en_gu/train.en
    path_tgt: /kaggle/working/bpcc_en_gu/train.gu
    transforms:
    - sentencepiece
    - filtertoolong
  valid:
    path_src: /kaggle/working/bpcc_en_gu/valid.en
    path_tgt: /kaggle/working/bpcc_en_gu/valid.gu
    transforms:
    - sentencepiece
    - filtertoolong
transforms:
- sentencepiece
- filtertoolong
src_subword_model: /kaggle/working/opennmt_model/sentencepiece.model
tgt_subword_model: /kaggle/working/opennmt_model/sentencepiece.model
model_task: seq2seq
encoder_type: transformer
decoder_type: transformer
layers: 4
hidden_size: 256
word_vec_size: 256
transformer_ff: 1024
heads: 4
transformer_dropout: 0.1
dropout: 0.1
position_encoding: true
