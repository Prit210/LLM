train_steps: 10000
valid_steps: 1000
warmup_steps: 500
report_every: 100
batch_type: tokens
batch_size: 2048
valid_batch_size: 2048
accum_count:
- 2
optim: adam
learning_rate: 2.0
decay_method: noam
adam_beta1: 0.9
adam_beta2: 0.998
max_grad_norm: 0
label_smoothing: 0.1
world_size: 1
gpu_ranks:
- 0
seed: 42
max_generator_batches: 2
max_relative_positions: 0
share_embeddings: true
share_decoder_embeddings: true
